<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><link rel="stylesheet" href="styles.css" /><title>
    双语阅读 Next
  </title>
  <body class="popup">
    <p><a href="learning.html" target="_blank">英语学习 · 设置与学习库</a></p>
    <h1>双语阅读</h1>
    <p id="connection" class="muted"></p>
    <label class="check"
      ><input
        id="auto-translate"
        type="checkbox"
        disabled
      />打开外语网页自动翻译</label
    >
    <p id="auto-status" class="muted" role="status">正在读取自动翻译设置…</p>
    <details>
      <summary>划词、悬停与输入框翻译</summary>
      <label class="check"
        ><input
          id="quick-selection"
          type="checkbox"
          disabled
        />划词后显示翻译按钮</label
      >
      <label class="check"
        ><input id="quick-hover" type="checkbox" disabled />按住 Alt
        悬停翻译段落</label
      >
      <label class="check"
        ><input
          id="quick-input"
          type="checkbox"
          disabled
        />输入框翻译（Alt+T）</label
      >
      <label for="quick-target">输入框译成</label
      ><select id="quick-target" disabled></select>
      <p id="quick-status" class="muted" role="status">正在读取设置…</p>
    </details>
    <p class="muted">
      翻译会把可见正文发给所选 API。每轮最多 300 片 / 6 万字符。
    </p>
    <button id="start" class="primary" disabled>翻译此页 / 重新开始</button>
    <p id="status" role="status" aria-live="polite">正在读取状态…</p>
    <div class="actions">
      <button id="stop">停止</button><button id="restore">恢复原文</button
      ><button id="retry">重试失败并继续</button
      ><button id="continue">继续下一轮</button
      ><button id="settings">设置</button
      ><button id="workbench">文件与字幕工作台</button>
    </div>
    <p class="muted">重新开始或重试可能再次计费。停止不能保证远端不计费。</p>
    <button id="video-quick" class="primary" disabled>
      一键双语字幕（现成字幕）
    </button>
    <button id="video-open" disabled>选择轨道 / 导入字幕</button>
    <section id="video-panel" hidden>
      <p id="video-source" class="muted"></p>
      <div id="video-manual-controls">
        <label for="video-select">视频</label
        ><select id="video-select"></select
        ><label for="video-track">已有字幕轨道</label
        ><select id="video-track"></select
        ><label for="video-file">或导入 SRT / VTT</label
        ><input id="video-file" type="file" accept=".srt,.vtt" />
      </div>
      <div class="actions">
        <button id="video-start" class="primary" disabled>翻译字幕</button
        ><button id="video-stop">恢复原字幕</button
        ><button id="video-continue" disabled>继续</button
        ><button id="video-retry" disabled>重试</button
        ><button id="video-export" disabled>导出双语 SRT</button>
      </div>
      <p id="video-status" role="status"></p>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
