<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Bilingual test article</title
  ><style>
    body {
      max-width: 760px;
      margin: 40px auto;
      font: 18px/1.6 system-ui;
    }
    #below {
      margin-top: 1800px;
    }
  </style>
  <nav><p>Navigation must not translate</p></nav>
  <main>
    <h1>A public reading example</h1>
    <p id="first">
      A short article helps us understand
      <a href="#below" id="link">the world</a>.
      <button>Do not send this button</button> <code>secret code</code>
    </p>
    <p id="readonly" contenteditable="false">This content is read only.</p>
    <p contenteditable="true">Private editor text.</p>
    <p id="japanese">日本語の文章です。</p>
    <div><p id="nested">Nested paragraph appears exactly once.</p></div>
    <p hidden>Hidden private text</p>
    <p id="below">Below the first screen.</p>
  </main>
</html>
