<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>目标语言跳过检查</title
  ><style>
    body {
      max-width: 760px;
      margin: 36px auto;
      font: 18px/1.7 system-ui;
    }
  </style>
  <main>
    <p>
      这是一篇中文文章，页面虽然错误地标记为英文，但实际正文是中文。自动翻译应判断正文的主要语言，避免把已经能够阅读的中文再发给翻译服务。
    </p>
    <p>
      实验室尚未证实这种电池可以安全使用。研究人员需要记录每一个观察结果，包括不符合最初预测的数据。温度、压力和质量变化都应保留原本的数值与单位。
    </p>
    <p>
      这个测试检查的是本机的语言判断与请求控制，没有发送真实付费请求。读者关闭自动翻译后，后续打开的页面应继续显示原文；需要翻译时仍然可以手动点击按钮。
    </p>
  </main>
</html>
